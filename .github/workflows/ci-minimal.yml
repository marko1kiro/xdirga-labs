name: CI Minimal

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-minimal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.13.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run ts
      - name: Lint
        run: npx oxlint
      - name: Format check
        run: npx oxfmt --check
      - name: Unit tests
        run: npm run test
