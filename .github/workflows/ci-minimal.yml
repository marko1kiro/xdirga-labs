name: CI Minimal

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-minimal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint + Test
    # macOS matches upstream (unit tests run on macOS + Windows upstream).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.13.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # Required for @vscode/ripgrep postinstall to download its binary
          # without hitting GitHub API rate limits (unauthenticated = 60/hr
          # per shared runner IP -> 403). Same as upstream ci.yml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Must run before type-checking and unit tests: the vitest harness
      # imports the fake-llm-server in-process, so its own node_modules
      # (express 4 + @types) must be installed for both tsc and vitest
      # to resolve the right packages.
      - name: Prep test server
        run: cd testing/fake-llm-server && npm install && npm run build && cd -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck
        run: npm run ts
      - name: Lint
        run: npx oxlint
      - name: Format check
        run: npx oxfmt --check
      # The node --test scripts from `npm run test` (quick, no OOM).
      - name: Node script tests
        run: node --test scripts/promote-previous-beta.test.mjs scripts/start-supervisor.test.mjs scripts/copy-data-to-dev.test.mjs scripts/unauthorized-release-alert.test.mjs scripts/pr-review/validate-review.test.mjs scripts/issue-triage/triage-comment.test.mjs scripts/issue-triage/prepare-context.test.mjs
      # Vitest sharded: a single vitest run OOMs even at 4GB heap (a worker
      # accumulates memory across files and hits the limit after all tests
      # pass). Sharding splits the suite so each shard runs a quarter of
      # the files in a fresh process. Standard for large suites, not a leak
      # workaround: each shard must pass on its own, and 0 test failures
      # is still required. Shard 2/2 OOMed at 4GB after only 65 files, so
      # 2 shards is not enough — 4 shards splits the heavy half further.
      - name: Unit tests (shard 1/4)
        run: npx vitest run --shard=1/4
        env:
          NODE_OPTIONS: --no-deprecation --max-old-space-size=4096
          VITE_CJS_IGNORE_WARNING: "true"
      - name: Unit tests (shard 2/4)
        if: always()
        run: npx vitest run --shard=2/4
        env:
          NODE_OPTIONS: --no-deprecation --max-old-space-size=4096
          VITE_CJS_IGNORE_WARNING: "true"
      - name: Unit tests (shard 3/4)
        if: always()
        run: npx vitest run --shard=3/4
        env:
          NODE_OPTIONS: --no-deprecation --max-old-space-size=4096
          VITE_CJS_IGNORE_WARNING: "true"
      # Shard 4 OOMed at 4GB after only 21 files even sequentially
      # (maxWorkers=1), so a single file in this shard leaks to 4GB by
      # itself. Run it in forks pool: each file gets its own process, so
      # a leaking file kills only its fork and Vitest reports which file
      # it was, instead of crashing the whole shard.
      - name: Unit tests (shard 4/4)
        if: always()
        run: npx vitest run --shard=4/4 --pool=forks --maxWorkers=1
        env:
          NODE_OPTIONS: --no-deprecation --max-old-space-size=4096
          VITE_CJS_IGNORE_WARNING: "true"
