name: CI Minimal

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-minimal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + Lint + Test
    # Upstream never ran unit tests on Ubuntu: Vitest tinypool crashes on
    # ubuntu-latest with Channel closed after all tests pass. macOS matches upstream.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.13.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Must run before type-checking and unit tests: the vitest harness
      # imports the fake-llm-server in-process, so its own node_modules
      # (express 4 + @types) must be installed for both tsc and vitest
      # to resolve the right packages.
      - name: Prep test server
        run: cd testing/fake-llm-server && npm install && npm run build && cd -
      - name: Typecheck
        run: npm run ts
      - name: Lint
        run: npx oxlint
      - name: Format check
        run: npx oxfmt --check
      - name: Unit tests
        run: npm run test
